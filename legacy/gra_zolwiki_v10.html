  function levelFromXp(xp) {
    // 0-9 = lvl 1, 10-29 = lvl 2, 30-59 = lvl 3, 60-99 = lvl 4, ...
    // Wzór: xp_needed_for_level(n) = 10 * n * (n-1) / 2 + 10*(n-1)
    // Czyli kumulatywnie: lvl 1: 0, lvl 2: 10, lvl 3: 30, lvl 4: 60, lvl 5: 100, lvl 6: 150...
    let lvl = 1;
    let need = 0;
    while (xp >= need + lvl * 10) {
      need += lvl * 10;
      lvl++;
      if (lvl > 100) break; // cap
    }
    return { level: lvl, currentXp: xp - need, neededXp: lvl * 10 };
  }

  function hashPw(pw, salt) {
    let h1 = 5381;
    const s = salt + ':' + pw + ':' + salt;
    for (let i = 0; i < s.length; i++) { h1 = ((h1 << 5) + h1) ^ s.charCodeAt(i); h1 = h1 & 0xffffffff; }
    let h2 = 0x9e3779b9;
    const s2 = h1.toString(16) + s + s.length;
    for (let i = 0; i < s2.length; i++) { h2 = ((h2 << 5) + h2) ^ s2.charCodeAt(i); h2 = h2 & 0xffffffff; }
    return (h1 >>> 0).toString(16) + ':' + (h2 >>> 0).toString(16);
  }
  function makeSalt() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }

  // === DAILY / ACH HELPERS ===
  function todayKey() {
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }
  function getTodaysChallenge() {
    // wybór deterministyczny per dzień (DJB2-like na stringu daty)
    const k = todayKey();
    let h = 5381;
    for (let i = 0; i < k.length; i++) h = ((h << 5) + h + k.charCodeAt(i)) & 0xffffffff;
    return DAILY_CHALLENGES[Math.abs(h) % DAILY_CHALLENGES.length];
  }
  function ensureDaily(p) {
    if (!p.daily) p.daily = {};
    const today = todayKey();
    if (p.daily.day !== today) {
      p.daily = { day: today, progress: 0, claimed: false };
    }
  }
  function ensureAch(p) {
    if (!p.ach) p.ach = {};
    if (!p.stats) p.stats = { powerups: 0, gold: 0, wins: 0 };
  }
  function unlockAch(id) {
    if (!player.ach) player.ach = {};
    if (player.ach[id]) return false;
    player.ach[id] = true;
    player.totalEver += ACH_REWARD;
    pendingAchievements.push(id);
    return true;
  }
  function checkAchAfterAction() {
    // Achievementy które można sprawdzić w trakcie gry / po akcji
    const ownedKeys = Object.keys(player.owned).filter(k => player.owned[k]);
    if (ownedKeys.length >= 5) unlockAch('collector5');
    if (player.totalEver >= 1000) unlockAch('rich');
    // Pierwsza klasa per rzadkość
    const ownedRarities = new Set(ownedKeys.map(k => CLASSES[k].rarity));
    if (ownedRarities.has('rare')) unlockAch('firstrare');
    if (ownedRarities.has('epic')) unlockAch('firstepic');
    if (ownedRarities.has('legendary')) unlockAch('firstlegend');
    // Wszystkie basic
    const allBasic = Object.keys(CLASSES).filter(k => CLASSES[k].rarity === 'basic');
    if (allBasic.every(k => player.owned[k])) unlockAch('allbasic');
    // Endless milestones
    if ((player.endlessBest || 0) >= 50) unlockAch('endless50');
    if ((player.endlessBest || 0) >= 100) unlockAch('endless100');
    // Power-upy / gold
    if ((player.stats?.powerups || 0) >= 10) unlockAch('powerup10');
    if ((player.stats?.gold || 0) >= 1) unlockAch('goldsalad');
  }

  async function load() {
    try { const r = await window.storage.get(SESSION_KEY); if (r && r.value) Object.assign(session, JSON.parse(r.value)); } catch(e) {}
    if (typeof session.soundOn !== 'boolean') session.soundOn = true;
    try { const r = await window.storage.get(ACCOUNTS_KEY, true); if (r && r.value) accounts = JSON.parse(r.value); } catch(e) {}
    try { const r = await window.storage.get(RANK_SOLO_KEY, true); if (r && r.value) rankSolo = JSON.parse(r.value); } catch(e) {}
    try { const r = await window.storage.get(RANK_DUO_KEY, true); if (r && r.value) rankDuo = JSON.parse(r.value); } catch(e) {}
    try { const r = await window.storage.get(RANK_ENDLESS_KEY, true); if (r && r.value) rankEndless = JSON.parse(r.value); } catch(e) {}
    try { const r = await window.storage.get(EVENT_KEY, true); if (r && r.value) eventState = JSON.parse(r.value); } catch(e) {}
    if (!eventState.type) eventState.type = 'double';
    if (session.name && accounts[session.name.toLowerCase()]) {
      player = accounts[session.name.toLowerCase()];
      if (!player.owned) player.owned = {};
      if (!player.owned.normal) player.owned.normal = true;
      if (!player.selectedClass) player.selectedClass = 'normal';
      if (typeof player.endlessBest !== 'number') player.endlessBest = 0;
      if (typeof player.totalEverEaten !== 'number') player.totalEverEaten = player.totalEver || 0;
      if (!player.avatar) player.avatar = 'green';
      if (!player.friends) player.friends = [];
      if (!player.friendRequests) player.friendRequests = [];
      ensureDaily(player);
      ensureAch(player);
      screen = 'lobby';
    }
    if (evtChk) clearInterval(evtChk);
    evtChk = setInterval(() => {
      if (eventState.active && Date.now() > eventState.endsAt) {
        eventState.active = false; saveEvent();
        if (screen === 'lobby' || screen === 'shop') render();
      } else if (eventState.active && (screen === 'lobby' || screen === 'shop')) {
        const el = document.getElementById('eTimer');
        if (el) el.textContent = fmt(Math.max(0, eventState.endsAt - Date.now()));
      }
    }, 1000);
    render();
  }

  function fmt(ms) { const s = Math.ceil(ms/1000); return Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60); }

  function addToRank(arr, name, score, vipBadge) {
    const e = arr.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (e) {
      e.name = name;
      if (score > e.score) e.score = score;
      if (vipBadge) e.vipBadge = vipBadge;
    } else {
      arr.push({ name, score, vipBadge: vipBadge || null });
    }
    arr.sort((a, b) => b.score - a.score);
    return arr.slice(0, 10);
  }

  function getVipBadge(p) {
    if (!p || !p.owned) return null;
    if (p.owned.zolwiomly_bogacz) return '💎';
    if (p.owned.gvip_limited) return '👑';
    if (p.owned.svip_limited) return '💠';
    if (p.owned.vip_limited) return '🥇';
    return null;
  }

  async function endGame(mode, score1, score2, extra) {
    extra = extra || {};
    // W endless wynikiem są sekundy przetrwania, ale sałaty dają monety
    const survivedSec = extra.elapsedSec || 0;
    const finalScore = mode === 'endless' ? survivedSec : score1;
    // Monety: zjedzone sałaty (score1+score2 dla solo/duo, score1 dla endless)
    const coinsGained = score1 + score2;
    player.totalEver += coinsGained;
    player.totalEverEaten = (player.totalEverEaten || 0) + coinsGained;
    ensureAch(player);
    ensureDaily(player);

    // Update statystyk z rundy
    if (extra.powerupsCollected) player.stats.powerups += extra.powerupsCollected;
    if (extra.goldEaten) player.stats.gold += extra.goldEaten;
    if (extra.maxCombo3) {
      if (extra.maxCombo3 >= 1) unlockAch('combo3');
      if (extra.maxCombo3 >= 1 && extra.maxCombo5 >= 1) unlockAch('combo5');
    }

    const challenge = getTodaysChallenge();
    let dailyDelta = 0;

    if (mode === 'solo') {
      if (score1 > player.soloBest) player.soloBest = score1;
      rankSolo = addToRank(rankSolo, player.name, player.soloBest, getVipBadge(player));
      if (score1 >= 10) {
        player.stats.wins = (player.stats.wins || 0) + 1;
        unlockAch('first_win');
      }
      if (score1 >= 10 && extra.noHits) unlockAch('pacifist');
      if (extra.speedrun) unlockAch('speedrun');
      if (challenge.type === 'score_solo' && score1 > 0) {
        if (score1 >= challenge.target) dailyDelta = challenge.target;
        else dailyDelta = score1;
      }
      if (challenge.type === 'wins_solo' && score1 >= 10) dailyDelta = 1;
    } else if (mode === 'duo') {
      const best = Math.max(score1, score2);
      if (best > player.duoBest) player.duoBest = best;
      rankDuo = addToRank(rankDuo, player.name, player.duoBest, getVipBadge(player));
    } else if (mode === 'endless') {
      // W endless: rekord = sekundy przetrwania
      if (survivedSec > (player.endlessBest || 0)) player.endlessBest = survivedSec;
      rankEndless = addToRank(rankEndless, player.name, player.endlessBest, getVipBadge(player));
      if (challenge.type === 'endless') dailyDelta = survivedSec;
    }

    if (challenge.type === 'combo' && extra.combo3Count) dailyDelta = extra.combo3Count;
    if (challenge.type === 'powerups' && extra.powerupsCollected) dailyDelta = extra.powerupsCollected;
    if (challenge.type === 'gold' && extra.goldEaten) dailyDelta = extra.goldEaten;

    if (!player.daily.claimed) {
      if (challenge.type === 'score_solo' || challenge.type === 'endless') {
        if (dailyDelta > player.daily.progress) player.daily.progress = dailyDelta;
      } else {
        player.daily.progress += dailyDelta;
      }
      if (player.daily.progress >= challenge.target) {
        player.daily.progress = challenge.target;
        player.daily.claimed = true;
        player.totalEver += DAILY_REWARD;
      }
    }

    checkAchAfterAction();
    await savePlayer(); await saveRankings();
    screen = 'lobby'; render();
  }

  async function tryRegister(name, pw, pw2) {
    if (!name || !pw) { authError = t().errEmpty; render(); return; }
    if (pw.length < 4) { authError = t().errPassShort; render(); return; }
    if (pw !== pw2) { authError = t().errPassMatch; render(); return; }
    const key = name.toLowerCase();
    if (accounts[key]) { authError = t().errExists; render(); return; }
    const salt = makeSalt();
    accounts[key] = {
      name, salt, pwHash: hashPw(pw, salt),
      totalEver: 50, totalEverEaten: 0,
      soloBest: 0, duoBest: 0, endlessBest: 0,
      owned: { normal: true }, selectedClass: 'normal',
      starterShown: false,
      ach: {}, stats: { powerups: 0, gold: 0, wins: 0 },
      daily: { day: todayKey(), progress: 0, claimed: false },
      avatar: 'green',
      friends: [],
      friendRequests: []
    };
    await saveAccounts();
    player = accounts[key];
    session.name = player.name;
    await saveSession();
    authError = ''; screen = 'lobby'; render();
  }
  async function tryLogin(name, pw) {
    if (!name || !pw) { authError = t().errEmpty; render(); return; }
    const a = accounts[name.toLowerCase()];
    if (!a) { authError = t().errBadLogin; render(); return; }
    if (hashPw(pw, a.salt) !== a.pwHash) { authError = t().errBadLogin; render(); return; }
    if (!a.owned) a.owned = { normal: true };
    if (!a.selectedClass) a.selectedClass = 'normal';
    if (typeof a.endlessBest !== 'number') a.endlessBest = 0;
    if (typeof a.totalEverEaten !== 'number') a.totalEverEaten = a.totalEver || 0;
    if (!a.avatar) a.avatar = 'green';
    if (!a.friends) a.friends = [];
    if (!a.friendRequests) a.friendRequests = [];
    ensureDaily(a);
    ensureAch(a);
    player = a; session.name = player.name;
    await saveSession();
    authError = ''; screen = 'lobby'; render();
  }

    else { adminError = t().wrongCode; render(); }

  // === FRIENDS SYSTEM ===
  // friends: tablica nazw [string]
  // friendRequests: tablica zaproszeń od innych [string] (czekają na akceptację)

  async function sendFriendRequest(targetName) {
    const target = accounts[targetName.toLowerCase()];
    if (!target) return { ok: false, msg: t().friendNotFound };
    if (target.name.toLowerCase() === player.name.toLowerCase()) return { ok: false, msg: t().cantAddSelf };
    // Sprawdź czy już są znajomymi
    if (player.friends.some(f => f.toLowerCase() === target.name.toLowerCase())) {
      return { ok: false, msg: t().alreadyFriend };
    }
    // Sprawdź czy już jest pending
    if (!target.friendRequests) target.friendRequests = [];
    if (target.friendRequests.some(r => r.toLowerCase() === player.name.toLowerCase())) {
      return { ok: false, msg: t().requestExists };
    }
    // Dodaj zaproszenie do cudzego konta
    target.friendRequests.push(player.name);
    accounts[target.name.toLowerCase()] = target;
    await saveAccounts();
    return { ok: true, msg: t().requestSent };
  }

  async function acceptFriendRequest(fromName) {
    if (!player.friendRequests) player.friendRequests = [];
    const idx = player.friendRequests.findIndex(r => r.toLowerCase() === fromName.toLowerCase());
    if (idx < 0) return;
    const from = accounts[fromName.toLowerCase()];
    if (!from) {
      // konto zniknęło - usuń zaproszenie
      player.friendRequests.splice(idx, 1);
      await savePlayer();
      return;
    }
    // Usuń z requests, dodaj do friends u obu graczy
    player.friendRequests.splice(idx, 1);
    if (!player.friends.some(f => f.toLowerCase() === from.name.toLowerCase())) {
      player.friends.push(from.name);
    }
    if (!from.friends) from.friends = [];
    if (!from.friends.some(f => f.toLowerCase() === player.name.toLowerCase())) {
      from.friends.push(player.name);
    }
    accounts[from.name.toLowerCase()] = from;
    await saveAccounts();
    await savePlayer();
  }

  async function declineFriendRequest(fromName) {
    if (!player.friendRequests) player.friendRequests = [];
    const idx = player.friendRequests.findIndex(r => r.toLowerCase() === fromName.toLowerCase());
    if (idx < 0) return;
    player.friendRequests.splice(idx, 1);
    await savePlayer();
  }

  async function removeFriend(friendName) {
    if (!confirm((lang() === 'pl' ? 'Usunąć ' : 'Retirer ') + friendName + '?')) return;
    if (!player.friends) player.friends = [];
    player.friends = player.friends.filter(f => f.toLowerCase() !== friendName.toLowerCase());
    const friend = accounts[friendName.toLowerCase()];
    if (friend && friend.friends) {
      friend.friends = friend.friends.filter(f => f.toLowerCase() !== player.name.toLowerCase());
      accounts[friend.name.toLowerCase()] = friend;
    }
    await saveAccounts();
    await savePlayer();
    render();
  }

    return ACHIEVEMENTS.every(a => p.ach[a.id]);

  // === EXPORT/IMPORT konta — backup żeby nie tracić postępów ===
  function exportAccount() {
    if (!player) return;
    const data = {
      version: 'v8',
      exportedAt: new Date().toISOString(),
      player: player
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `zolwiki_${player.name}_${todayKey()}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  async function importAccount(file) {
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!data.player || !data.player.name) {
        alert(lang() === 'pl' ? '⚠️ To nie jest plik z konta Żółwików' : '⚠️ Ce n\'est pas un fichier de compte');
        return;
      }
      const p = data.player;
      const key = p.name.toLowerCase();
      const exists = accounts[key];
      const confirmMsg = exists
        ? (lang() === 'pl' ? `Konto "${p.name}" już istnieje. Nadpisać?` : `Le compte "${p.name}" existe déjà. Écraser ?`)
        : (lang() === 'pl' ? `Wczytać konto "${p.name}"?` : `Charger le compte "${p.name}" ?`);
      if (!confirm(confirmMsg)) return;
      // Zapewniamy że konto ma wszystkie wymagane pola
      if (!p.owned) p.owned = { normal: true };
      if (!p.selectedClass) p.selectedClass = 'normal';
      if (typeof p.endlessBest !== 'number') p.endlessBest = 0;
      if (typeof p.totalEver !== 'number') p.totalEver = 0;
      if (typeof p.soloBest !== 'number') p.soloBest = 0;
      if (typeof p.duoBest !== 'number') p.duoBest = 0;
      if (!p.ach) p.ach = {};
      if (!p.stats) p.stats = { powerups: 0, gold: 0, wins: 0 };
      if (!p.daily) p.daily = { day: todayKey(), progress: 0, claimed: false };
      accounts[key] = p;
      await saveAccounts();
      // Auto-zaloguj
      player = p;
      session.name = p.name;
      await saveSession();
      screen = 'lobby';
      render();
    } catch(e) {
      alert(lang() === 'pl' ? '⚠️ Błąd: nieprawidłowy plik' : '⚠️ Erreur : fichier invalide');
    }
  }

  function classCard(key) {
    const c = CLASSES[key];
    const r = RARITY[c.rarity];
    const owned = player.owned[key];
    const selected = player.selectedClass === key;
    const price = c.customPrice || r.price;
    const canAfford = player.totalEver >= price;
    const border = selected ? `3px solid ${r.dark}` : `2px solid ${r.color}`;
    const className = c.names[lang()];
    const classDesc = c.descs[lang()];

    // CENA / STATUS - zawsze widoczne
    let priceTag = '';
    if (owned) {
      priceTag = `<div style="background: ${r.dark}; color: white; padding: 6px 10px; border-radius: var(--border-radius-md); font-size: 12px; font-weight: 500; margin-top: 8px; text-align: center;">${selected ? t().selected : t().owned}</div>`;
    } else {
      priceTag = `<div style="background: ${canAfford ? r.color : '#D3D1C7'}; color: ${canAfford ? r.dark : '#5F5E5A'}; padding: 6px 10px; border-radius: var(--border-radius-md); font-size: 14px; font-weight: 500; margin-top: 8px; text-align: center;">${price} 🥬</div>`;

    if (owned && !selected) {
      action = `<button data-select="${key}" style="font-size: 12px; margin-top: 6px; width: 100%; padding: 6px;">${t().pick}</button>`;
    } else if (!owned) {
      action = `<button data-buy="${key}" ${!canAfford ? 'disabled' : ''} style="font-size: 12px; margin-top: 6px; width: 100%; padding: 6px; ${!canAfford ? 'opacity:0.5;' : `background: ${r.color}; border-color: ${r.dark}; color: ${r.dark}; font-weight: 500;`}">${canAfford ? t().buy : t().notEnough}</button>`;
    }

    return `
      <div style="background: ${r.bg}; border: ${border}; border-radius: var(--border-radius-lg); padding: 10px; text-align: center; position: relative; display: flex; flex-direction: column;">
        <div style="position: absolute; top: 6px; right: 8px; font-size: 9px; color: ${r.dark}; font-weight: 500; background: rgba(255,255,255,0.5); padding: 2px 6px; border-radius: 4px;">${r.names[lang()]}</div>

  function showConfetti() {
    const box = document.getElementById('zw-confetti');
    if (!box) return;
    box.style.display = 'block';
    box.innerHTML = '';
    const emojis = ['🎉', '🎊', '✨', '💎', '⭐', '🥳', '🌟'];
    for (let i = 0; i < 35; i++) {
      const s = document.createElement('span');
      s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      s.style.left = (Math.random() * 100) + '%';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      s.style.animationDuration = (1.5 + Math.random()) + 's';
      box.appendChild(s);
    }
    setTimeout(() => { box.style.display = 'none'; box.innerHTML = ''; }, 2500);
  }

  function startGame(mode, classKey, eventOn) {
    const isDuo = mode === 'duo';
    const isEndless = mode === 'endless';
    const c = CLASSES[classKey];
    // Klasa żółtego (drugiego gracza) - z konta znajomego jeśli wybrany
    let yellowClassKey = 'normal';
    if (isDuo && duoFriend) {
      const friend = accounts[duoFriend.toLowerCase()];
      if (friend && friend.selectedClass && CLASSES[friend.selectedClass]) {
        yellowClassKey = friend.selectedClass;
      }
    }
    const cYellow = CLASSES[yellowClassKey];
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const score1El = document.getElementById('score1');
    const score2El = document.getElementById('score2');
    const livesEl = document.getElementById('lives');
    const timeEl = document.getElementById('time');
    const comboBox = document.getElementById('comboBox');
    const comboVal = document.getElementById('comboVal');

    const VIEW_W = canvas.width, VIEW_H = canvas.height;
    const MAP_W = VIEW_W * 2, MAP_H = VIEW_H * 2;
    const isRain = eventOn && eventState.type === 'rain';
    const eventMul = (eventOn && eventState.type === 'double') ? 2 : 1;
    const speedMul = Math.min(c.speed * eventMul, MAX_SPEED_MULT);
    const pointMul = c.points * eventMul;
    const magnet = c.magnet || 0;
    const dodge = c.dodge || 0;
    const bonusTime = c.bonusTime || 0;
    const bounce = c.bounce || false;
    const freeze = c.freezeRocks || false;
    const isRainbow = c.rainbow || false;
    // Moce żółtego (z klasy znajomego)
    const speedMul2 = Math.min(cYellow.speed * eventMul, MAX_SPEED_MULT);
    const pointMul2 = cYellow.points * eventMul;
    const magnet2 = cYellow.magnet || 0;
    const dodge2 = cYellow.dodge || 0;
    const target = isDuo ? 15 : 10;

    let t1, t2, lettuces, rocks, powerups, score1, score2, timeLeft, elapsedSec, keys, gameOver;
    let camX = 0, camY = 0;
    let rafId = null, timer = null;
    let invuln1 = 120, invuln2 = 120;
    let lives1 = c.lives;
    let lives2 = isDuo ? cYellow.lives : 0; // żółty ma życia z klasy znajomego (lub 1 dla normal)
    let bounceCount = 0;
    let bounceCount2 = 0;
    let particles = [];
    let combo1 = 0, comboTimer1 = 0;
    let combo2 = 0, comboTimer2 = 0;
    let deathAnim = null;
    let rainTimer = 0;
    let powerupTimer = 0;
    let starShield = 0;
    let starShield2 = 0;
    let globalMagnet = 0;
    // Statystyki rundy do raportowania w endGame
    let runStats = {
      powerupsCollected: 0,
      goldEaten: 0,
      maxCombo3: 0,    // count combo ×2 reached
      maxCombo5: 0,    // count combo ×3 reached
      combo3Count: 0,  // ile razy uderzył combo ×2
      noHits: true,    // czy bez trafienia
      speedrun: false  // 10 sałat w pierwszych 30 sek
    };

    // === AUDIO ===
    let audioCtx = null;
    let lastAmTime = 0;
    function getAudio() {
      if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
      return audioCtx;
    }
    function unlockAudio() {
      const a = getAudio(); if (!a) return;
      if (a.state === 'suspended') a.resume();
    }
    function playAm() {
      if (!session.soundOn) return;
      const a = getAudio(); if (!a || a.state !== 'running') return;
      const now = a.currentTime;
      if (now - lastAmTime < 0.1) return;
      lastAmTime = now;
      const osc = a.createOscillator(), gain = a.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.18);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
      osc.connect(gain).connect(a.destination);
      osc.start(now); osc.stop(now + 0.25);
    }
    function playHit() {
      if (!session.soundOn) return;
      const a = getAudio(); if (!a || a.state !== 'running') return;
      const now = a.currentTime;
      const o = a.createOscillator(), g = a.createGain();
      o.type = 'square'; o.frequency.value = 90;
      g.gain.setValueAtTime(0.3, now);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      o.connect(g).connect(a.destination);
      o.start(now); o.stop(now + 0.22);
    }
    function playBek() {
      if (!session.soundOn) return;
      const a = getAudio(); if (!a || a.state !== 'running') return;
      const now = a.currentTime;
      const osc = a.createOscillator(), gain = a.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.linearRampToValueAtTime(90, now + 0.7);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.85);
      osc.connect(gain).connect(a.destination);
      osc.start(now); osc.stop(now + 0.85);
    }
    function playWin() {
      if (!session.soundOn) return;
      const a = getAudio(); if (!a || a.state !== 'running') return;
      const now = a.currentTime;
      [523, 659, 784, 1047].forEach((f, i) => {
        const osc = a.createOscillator(), g = a.createGain();
        osc.type = 'triangle'; osc.frequency.value = f;
        g.gain.setValueAtTime(0.0001, now + i*0.12);
        g.gain.exponentialRampToValueAtTime(0.3, now + i*0.12 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.12 + 0.18);
        osc.connect(g).connect(a.destination);
        osc.start(now + i*0.12); osc.stop(now + i*0.12 + 0.2);
      });
    }
    function playCombo() {
      if (!session.soundOn) return;
      const a = getAudio(); if (!a || a.state !== 'running') return;
      const now = a.currentTime;
      const osc = a.createOscillator(), g = a.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(660, now);
      osc.frequency.exponentialRampToValueAtTime(990, now + 0.15);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
      osc.connect(g).connect(a.destination);
      osc.start(now); osc.stop(now + 0.22);
    }

    function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
    function spawnLettuce() {
      // W evencie 1/10 sałat to złota (10× wartości)
      const gold = eventOn && Math.random() < 0.1;
      lettuces.push({
        x: 40+Math.random()*(MAP_W-80),
        y: 40+Math.random()*(MAP_H-80),
        size: 20,
        gold
      });
    }
    function spawnRock() {
      let r, tries = 0;
      do { r = { x: 40+Math.random()*(MAP_W-80), y: 40+Math.random()*(MAP_H-80), size: 24 }; tries++; }
      while ((dist(r, t1) < 140 || (isDuo && dist(r, t2) < 140)) && tries < 20);
      rocks.push(r);
    }
    function spawnPowerup() {
      const type = POWERUP_KEYS[Math.floor(Math.random() * POWERUP_KEYS.length)];
      let p, tries = 0;
      do {
        p = {
          x: 80+Math.random()*(MAP_W-160),
          y: 80+Math.random()*(MAP_H-160),
          size: 22,
          type,
          life: 600,    // 10 sek przy 60fps
          maxLife: 600,
          bobPhase: Math.random() * Math.PI * 2
        };
        tries++;
      } while ((dist(p, t1) < 100 || (isDuo && dist(p, t2) < 100)) && tries < 20);
      powerups.push(p);
    }
    function spawnParticle(x, y, txt, color) {
      // particles wokół pozycji + tekst "+1" wyskakujący
      for (let i = 0; i < 5; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 1 + Math.random() * 2;
        particles.push({
          type: 'dot', x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
          life: 25, maxLife: 25, color
        });
      }
      particles.push({ type: 'text', x, y, vy: -1.5, life: 35, maxLife: 35, txt, color });
    }
    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx || 0;
        p.y += p.vy;
        if (p.type === 'dot') p.vy += 0.15; // grawitacja
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }
    function drawParticles() {
      for (const p of particles) {
        const x = p.x - camX, y = p.y - camY;
        const a = p.life / p.maxLife;
        ctx.globalAlpha = a;
        if (p.type === 'dot') {
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
        } else {
          ctx.fillStyle = p.color;
          ctx.font = '500 18px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(p.txt, x, y);
        }
      }
      ctx.globalAlpha = 1;
    }

    function init() {
      t1 = { x: MAP_W/2 - (isDuo?80:0), y: MAP_H/2, size: 26, speed: 3.5*speedMul,
             color: 'green', moving: false, classKey, walkPhase: 0, facing: 'right' };
      t2 = isDuo ? { x: MAP_W/2+80, y: MAP_H/2, size: 26, speed: 3.5*speedMul2,
                     color: 'yellow', moving: false, classKey: yellowClassKey, walkPhase: 0, facing: 'right' } : null;
      lettuces = []; rocks = []; powerups = [];
      score1 = 0; score2 = 0;
      // Endless: brak czasu (timeLeft staje się elapsed seconds, rośnie)
      timeLeft = isEndless ? 0 : (60 + bonusTime);
      elapsedSec = 0;
      keys = {}; gameOver = false;
      const nL = isDuo ? 14 : 12, nR = isDuo ? 6 : 5;
      for (let i = 0; i < nL; i++) spawnLettuce();
      for (let i = 0; i < nR; i++) spawnRock();
      score1El.textContent = 0;
      if (score2El) score2El.textContent = 0;
      timeEl.textContent = timeLeft;
      if (livesEl) livesEl.textContent = lives1;
      const cx = isDuo ? (t1.x+t2.x)/2 : t1.x;
      const cy = isDuo ? (t1.y+t2.y)/2 : t1.y;
      camX = Math.max(0, Math.min(MAP_W-VIEW_W, cx-VIEW_W/2));
      camY = Math.max(0, Math.min(MAP_H-VIEW_H, cy-VIEW_H/2));
    }

    function colorsFor(turt) {
      const cl = CLASSES[turt.classKey];
      // Żółty bez specjalnej klasy = klasyczne pomarańczowe
      if (turt.color === 'yellow' && turt.classKey === 'normal') {
        return { main: '#BA7517', inner: '#854F0B', skin: '#EF9F27' };
      }
      // Rainbow effect
      if (cl.rainbow) {
        const hue = (turt.walkPhase * 30) % 360;
        return {
          main: `hsl(${hue}, 70%, 35%)`,
          inner: `hsl(${hue}, 70%, 25%)`,
          skin: `hsl(${(hue+30) % 360}, 70%, 60%)`
        };
      }
      const r = RARITY[cl.rarity];
      return { main: r.dark, inner: r.dark, skin: r.color };
    }

    function drawTurtle(turt, invuln) {
      const x = turt.x - camX, y = turt.y - camY;
      const cols = colorsFor(turt);
      const blink = invuln > 0 && Math.floor(invuln/4) % 2 === 0;
      const phase = turt.walkPhase;
      const wob = turt.moving ? Math.sin(phase) * 4 : 0;
      const headBob = turt.moving ? Math.sin(phase * 2) * 1.5 : 0;
      const facing = turt.facing;

      ctx.save();
      ctx.translate(x, y);

      // Rotacja w zależności od kierunku - obracam całą skorupę + nogi pozostają na boku
      // Strategia: zawsze rysuję jakby żółw szedł w prawo, potem rotuję canvas
      let rotation = 0;
      if (facing === 'right') rotation = 0;
      else if (facing === 'left') rotation = Math.PI;
      else if (facing === 'up') rotation = -Math.PI / 2;
      else if (facing === 'down') rotation = Math.PI / 2;
      ctx.rotate(rotation);

      // Cień pod żółwiem - rysowany BEZ rotacji bo zawsze pod
      ctx.rotate(-rotation); // odwracam żeby cień był poziomy
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath(); ctx.ellipse(0, turt.size-2, turt.size, 7, 0, 0, Math.PI*2); ctx.fill();
      ctx.rotate(rotation); // wracam do rotacji żółwia

      ctx.globalAlpha = blink ? 0.4 : 1;

      const cl = CLASSES[turt.classKey];
      // Aury rysuję bez rotacji bo to okręgi
      ctx.rotate(-rotation);
      if (turt === t1 && starShield > 0) {
        ctx.strokeStyle = '#FAC775';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(0, 0, turt.size+8+Math.sin(phase*2)*3, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, turt.size+12+Math.sin(phase*2)*3, 0, Math.PI*2); ctx.stroke();
      } else if (cl.rarity === 'limited') {
        const tt = Date.now() / 200;
        ctx.strokeStyle = '#FAC775';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, turt.size+5+Math.sin(tt)*3, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#E84A6F';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, turt.size+10+Math.sin(tt+1)*3, 0, Math.PI*2); ctx.stroke();
        ctx.strokeStyle = '#7A1A8C';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, turt.size+15+Math.sin(tt+2)*3, 0, Math.PI*2); ctx.stroke();
        const sparkAng = Date.now() / 300;
        for (let i = 0; i < 3; i++) {
          const a = sparkAng + (i * Math.PI * 2 / 3);
          const sxs = Math.cos(a) * (turt.size + 18);
          const sys = Math.sin(a) * (turt.size + 18);
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath(); ctx.arc(sxs, sys, 2.5, 0, Math.PI*2); ctx.fill();
        }
      } else if (cl.rarity === 'legendary' || (eventOn && eventState.type === 'double')) {
        ctx.strokeStyle = '#FAC775';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, turt.size+4+Math.sin(phase)*2, 0, Math.PI*2); ctx.stroke();
      }
      ctx.rotate(rotation); // wracam do rotacji żółwia

      // ŁAPY - 4 łapki na rogach skorupy, animowane (przeciwne fazy)
      ctx.fillStyle = cols.skin;
      ctx.beginPath(); ctx.arc(-(turt.size-6), -(turt.size-6)+wob, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc((turt.size-6), (turt.size-6)-wob, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc((turt.size-6), -(turt.size-6)-wob, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-(turt.size-6), (turt.size-6)+wob, 7, 0, Math.PI*2); ctx.fill();

      // BIAŁA OBWÓDKA WOKÓŁ SKORUPY - dla widoczności
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, turt.size + 1, 0, Math.PI*2); ctx.stroke();

      // SKORUPA - główny okrąg
      ctx.fillStyle = cols.main;
      ctx.beginPath(); ctx.arc(0, 0, turt.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = cols.inner;
      ctx.beginPath(); ctx.arc(0, 0, turt.size-6, 0, Math.PI*2); ctx.fill();

      // WZÓR NA SKORUPIE - 6 kropek
      ctx.fillStyle = cols.main;
      for (let i = 0; i < 6; i++) {
        const a = i*Math.PI/3;
        ctx.beginPath();
        ctx.arc(Math.cos(a)*(turt.size-12), Math.sin(a)*(turt.size-12), 5, 0, Math.PI*2);
        ctx.fill();
      }

      // GŁOWA - z białą obwódką, "wystaje" w kierunku ruchu (po rotacji = zawsze w prawo)
      // Ruch głowy w przód-tył (headBob) gdy idzie
      const headX = turt.size - 4 + (turt.moving ? Math.abs(headBob) : 0);
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(headX, 0, 10, 0, Math.PI*2); ctx.stroke();
      ctx.fillStyle = cols.skin;
      ctx.beginPath(); ctx.arc(headX, 0, 10, 0, Math.PI*2); ctx.fill();

      // OCZY - dwoje oczu na głowie (zależnie od kierunku patrzenia)
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(headX + 4, -4, 3, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(headX + 4, 4, 3, 0, Math.PI*2); ctx.fill();
      // ŹRENICE
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.arc(headX + 5, -4, 1.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(headX + 5, 4, 1.5, 0, Math.PI*2); ctx.fill();

      // OGON - mały trójkątny ogonek z tyłu
      ctx.fillStyle = cols.skin;
      ctx.beginPath();
      ctx.moveTo(-turt.size, 0);
      ctx.lineTo(-turt.size - 5, -3);
      ctx.lineTo(-turt.size - 5, 3);
      ctx.closePath();
      ctx.fill();

      ctx.globalAlpha = 1;
      ctx.restore();

      // EMOJI nad żółwiem - bez rotacji żeby było zawsze czytelne
      ctx.font = '14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cl.emoji, x, y - turt.size - 4);
    }
    function drawDeath() {
      if (!deathAnim) return;
      deathAnim.frame++;
      deathAnim.rot += 0.3;
      const x = deathAnim.x - camX, y = deathAnim.y - camY;
      const scale = 1 + deathAnim.frame * 0.05;
      const alpha = Math.max(0, 1 - deathAnim.frame / 30);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(deathAnim.rot);
      ctx.scale(scale, scale);
      ctx.fillStyle = '#3B6D11';
      ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#27500A';
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    function drawLettuce(l) {
      const x = l.x-camX, y = l.y-camY;
      if (x < -30 || x > VIEW_W+30 || y < -30 || y > VIEW_H+30) return;
      // Złota sałata - złota poświata pulsująca
      if (l.gold) {
        const pulse = 1 + Math.sin(Date.now()/200) * 0.2;
        ctx.fillStyle = 'rgba(250, 199, 117, 0.5)';
        ctx.beginPath(); ctx.arc(x, y, (l.size+10) * pulse, 0, Math.PI*2); ctx.fill();
        // Biała obwódka
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(x, y, l.size + 1, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = '#FAC775';
        ctx.beginPath(); ctx.arc(x, y, l.size, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#BA7517';
        ctx.beginPath();
        ctx.arc(x-6, y-4, 8, 0, Math.PI*2);
        ctx.arc(x+6, y-4, 8, 0, Math.PI*2);
        ctx.arc(x, y+6, 8, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#854F0B';
        ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✨', x + Math.cos(Date.now()/300)*15, y + Math.sin(Date.now()/300)*15);
        return;
      }
      // Sałaty z deszczu
      if (l.fromRain) {
        ctx.fillStyle = 'rgba(133, 183, 235, 0.4)';
        ctx.beginPath(); ctx.arc(x, y, l.size+6, 0, Math.PI*2); ctx.fill();
      }
      // BIAŁA OBWÓDKA - kluczowa dla widoczności na trawie
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, l.size + 1, 0, Math.PI*2); ctx.stroke();
      // Sałata - jaśniejsza, bardziej żywa zieleń (żeby kontrastowała z ciemnozieloną trawą)
      ctx.fillStyle = '#B8E060';
      ctx.beginPath(); ctx.arc(x, y, l.size, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#7AC42F';
      ctx.beginPath();
      ctx.arc(x-6, y-4, 8, 0, Math.PI*2);
      ctx.arc(x+6, y-4, 8, 0, Math.PI*2);
      ctx.arc(x, y+6, 8, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#3B6D11';
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI*2); ctx.fill();
    }
    function drawPowerup(p) {
      const x = p.x-camX, y = p.y-camY;
      if (x < -40 || x > VIEW_W+40 || y < -40 || y > VIEW_H+40) return;
      const pt = POWERUP_TYPES[p.type];
      // miganie gdy zostało <2s (120 klatek)
      const blink = p.life < 120 && Math.floor(p.life/8) % 2 === 0;
      const bob = Math.sin(p.bobPhase + Date.now()/300) * 4;
      ctx.globalAlpha = blink ? 0.4 : 1;
      // Aura
      ctx.fillStyle = pt.color + '55';
      ctx.beginPath(); ctx.arc(x, y + bob, p.size + 6, 0, Math.PI*2); ctx.fill();
      // Tło
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(x, y + bob, p.size, 0, Math.PI*2); ctx.fill();
      // Border
      ctx.strokeStyle = pt.color;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y + bob, p.size, 0, Math.PI*2); ctx.stroke();
      // Emoji
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pt.emoji, x, y + bob);
      ctx.textBaseline = 'alphabetic';
      ctx.globalAlpha = 1;
    }
    function drawRock(r) {
      const x = r.x-camX, y = r.y-camY;
      if (x < -40 || x > VIEW_W+40 || y < -40 || y > VIEW_H+40) return;
      // CIEŃ pod kamieniem
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(x, y + r.size - 2, r.size, 5, 0, 0, Math.PI*2); ctx.fill();
      // CZARNA OBWÓDKA
      ctx.strokeStyle = '#1A1A1A';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, r.size, 0, Math.PI*2); ctx.stroke();
      // Główny kolor - ciemnoszary albo lodowy niebieski
      ctx.fillStyle = freeze ? '#5DA3D8' : '#6B6862';
      ctx.beginPath(); ctx.arc(x, y, r.size, 0, Math.PI*2); ctx.fill();
      // Ciemne plamy żeby wyglądał jak kamień
      ctx.fillStyle = freeze ? '#185FA5' : '#3D3B37';
      ctx.beginPath(); ctx.arc(x-6, y-6, 7, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x+5, y+4, 5, 0, Math.PI*2); ctx.fill();
      // Jasny highlight żeby był 3D
      ctx.fillStyle = freeze ? '#A2D0F0' : '#9B9893';
      ctx.beginPath(); ctx.arc(x-8, y-9, 4, 0, Math.PI*2); ctx.fill();
      // Kryształki na zamrożonych
      if (freeze) {
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x-9, y); ctx.lineTo(x+9, y);
        ctx.moveTo(x, y-9); ctx.lineTo(x, y+9);
        ctx.stroke();
      }
    }

    function moveTurtle(turt, mx, my) {
      if (mx === 0 && my === 0) { turt.moving = false; return; }
      turt.moving = true;
      // 4-kierunkowe facing: priorytet ma kierunek poziomy gdy idzie po skosie
      // bo mało zmian (głowa po prostu jest w bok). Jak idzie tylko góra/dół, używamy up/down.
      if (mx > 0) turt.facing = 'right';
      else if (mx < 0) turt.facing = 'left';
      else if (my < 0) turt.facing = 'up';
      else if (my > 0) turt.facing = 'down';
      if (mx !== 0 && my !== 0) { mx *= 0.707; my *= 0.707; }
      turt.x += mx * turt.speed;
      turt.y += my * turt.speed;
      turt.x = Math.max(turt.size, Math.min(MAP_W-turt.size, turt.x));
      turt.y = Math.max(turt.size, Math.min(MAP_H-turt.size, turt.y));
      turt.walkPhase += 0.35;
    }

    function updateCamera() {
      const cx = isDuo ? (t1.x+t2.x)/2 : t1.x;
      const cy = isDuo ? (t1.y+t2.y)/2 : t1.y;
      camX += ((cx-VIEW_W/2)-camX) * 0.35;
      camY += ((cy-VIEW_H/2)-camY) * 0.35;
      camX = Math.max(0, Math.min(MAP_W-VIEW_W, camX));
      camY = Math.max(0, Math.min(MAP_H-VIEW_H, camY));
    }
    let lastEndlessSpawn = -1;
    let amCounter = 0;
    function update() {
      if (gameOver) return;
      let mx1=0, my1=0;
      if (keys['ArrowUp']) my1-=1; if (keys['ArrowDown']) my1+=1;
      if (keys['ArrowLeft']) mx1-=1; if (keys['ArrowRight']) mx1+=1;
      moveTurtle(t1, mx1, my1);
      if (isDuo) {
        let mx2=0, my2=0;
        if (keys['w']||keys['W']) my2-=1; if (keys['s']||keys['S']) my2+=1;
        if (keys['a']||keys['A']) mx2-=1; if (keys['d']||keys['D']) mx2+=1;
        moveTurtle(t2, mx2, my2);
      }
      if (invuln1 > 0) invuln1--;
      if (invuln2 > 0) invuln2--;
      if (starShield > 0) starShield--;
      if (globalMagnet > 0) globalMagnet--;
      updateCamera();
      updateParticles();

      // Combo timer — combo wygasa po 3 sekundach bez sałaty
      if (comboTimer1 > 0) {
        comboTimer1--;
        if (comboTimer1 <= 0 && combo1 > 0) {
          combo1 = 0;
          comboBox.style.display = 'none';
        }
      }

      // Deszcz sałat: spawn co ~30 klatek (0.5s)
      if (isRain) {
        rainTimer++;
        if (rainTimer >= 30 && lettuces.length < 30) {
          rainTimer = 0;
          const gold = Math.random() < 0.1;
          const l = { x: 40+Math.random()*(MAP_W-80), y: 40+Math.random()*(MAP_H-80), size: 20, fromRain: true, gold };
          lettuces.push(l);
        }
      }

      // POWER-UPY: spawn co 13 sekund (780 klatek), max 1 na mapie
      powerupTimer++;
      if (powerupTimer >= 780 && powerups.length === 0) {
        powerupTimer = 0;
        spawnPowerup();
      }
      // Aktualizacja czasów życia power-upów
      for (let i = powerups.length-1; i >= 0; i--) {
        powerups[i].life--;
        if (powerups[i].life <= 0) powerups.splice(i, 1);
      }

      // ENDLESS: rosnąca trudność - co 30 sekund +1 stały kamień
      if (isEndless && elapsedSec > 0 && elapsedSec % 30 === 0 && elapsedSec !== lastEndlessSpawn) {
        lastEndlessSpawn = elapsedSec;
        spawnRock();
        spawnParticle(t1.x, t1.y - 50, '+🪨', '#5F5E5A');
      }

      // Magnes klasy + globalMagnet (truskawka)
      const effMagnet = globalMagnet > 0 ? Math.max(MAP_W, MAP_H) : magnet;
      if (effMagnet > 0) {
        for (const l of lettuces) {
          const d = dist(l, t1);
          if (d < effMagnet && d > 1) {
            const speed = globalMagnet > 0 ? 6 : 2;
            l.x += (t1.x-l.x)/d * speed;
            l.y += (t1.y-l.y)/d * speed;
          }
        }
      }

      // SAŁATY - zbieranie
      for (let i = lettuces.length-1; i >= 0; i--) {
        const l = lettuces[i];
        const d1 = dist(l, t1);
        const d2 = isDuo ? dist(l, t2) : Infinity;
        if (d1 < t1.size+l.size-8 && d1 <= d2) {
          // ZŁOTA SAŁATA: punkty ×10
          const goldMul = l.gold ? 10 : 1;
          const gained = Math.max(1, Math.round(pointMul)) * goldMul;
          // Combo bonus (działa też na złotych)
          const comboMul = combo1 >= 5 ? 3 : combo1 >= 3 ? 2 : 1;
          const totalGained = gained * comboMul;
          score1 += totalGained;
          combo1++;
          comboTimer1 = 180;
          if (combo1 === 3) runStats.combo3Count++;
          if (combo1 === 3) runStats.maxCombo3 = Math.max(runStats.maxCombo3, 1);
          if (combo1 === 5) runStats.maxCombo5 = Math.max(runStats.maxCombo5, 1);
          if (combo1 >= 3) {
            comboBox.style.display = '';
            comboVal.textContent = comboMul;
            if (combo1 === 3 || combo1 === 5) playCombo();
          }
          if (l.gold) {
            runStats.goldEaten++;
            spawnParticle(l.x, l.y, t().goldSalad, '#FAC775');
            playWin();
          } else {
            spawnParticle(l.x, l.y, '+' + totalGained, comboMul > 1 ? '#FAC775' : '#3B6D11');
            playAm();
          }
          score1El.textContent = score1;
          lettuces.splice(i, 1);
          spawnLettuce();
          if (score1 % 10 === 0 && score1 > 0 && !isEndless) spawnRock();
        } else if (isDuo && d2 < t2.size+l.size-8) {
          const goldMul = l.gold ? 10 : 1;
          const gained2 = Math.max(1, Math.round(pointMul2)) * goldMul;
          score2 += gained2;
          score2El.textContent = score2;
          combo2++;
          comboTimer2 = 180;
          if (l.gold) {
            runStats.goldEaten++;
            spawnParticle(l.x, l.y, t().goldSalad, '#FAC775');
            playWin();
          } else {
            spawnParticle(l.x, l.y, '+' + gained2, '#BA7517');
            playAm();
          }
          lettuces.splice(i, 1);
          spawnLettuce();
          if ((score1+score2) % 10 === 0) spawnRock();
        }
      }

      // POWER-UPY - zbieranie
      for (let i = powerups.length-1; i >= 0; i--) {
        const p = powerups[i];
        const d1 = dist(p, t1);
        if (d1 < t1.size + p.size - 6) {
          // Zebrano!
          const pt = POWERUP_TYPES[p.type];
          runStats.powerupsCollected++;
          playWin();
          if (p.type === 'tomato') {
            if (isEndless) {
              // W endless: pomidor daje +5 sałat-monet (bonus do zarobku)
              score1 += 5;
              score1El.textContent = score1;
              spawnParticle(p.x, p.y, '+5 🥬', pt.color);
            } else {
              timeLeft += 5;
              if (timeEl) timeEl.textContent = timeLeft;
              spawnParticle(p.x, p.y, t().tomatoTime, pt.color);
            }
          } else if (p.type === 'star') {
            starShield = 300; // 5 sekund
            invuln1 = Math.max(invuln1, 300);
            spawnParticle(p.x, p.y, t().starShield, pt.color);
          } else if (p.type === 'strawberry') {
            globalMagnet = 180; // 3 sekundy
            spawnParticle(p.x, p.y, t().strawberryMag, pt.color);
          } else if (p.type === 'bomb') {
            // Wszystkie kamienie wybuchają z efektem
            for (const r of rocks) {
              spawnParticle(r.x, r.y, '💥', '#C75A5A');
            }
            rocks = [];
            spawnParticle(p.x, p.y, t().bombBoom, pt.color);
          }
          powerups.splice(i, 1);
        }
      }

      // KAMIENIE - kolizje
      for (const r of rocks) {
        if (freeze) continue; // ICE: kamienie nie zabijają
        // Star shield: nieaktywne uderzenia
        if (starShield > 0) continue;

        if (invuln1 <= 0 && dist(r, t1) < t1.size+r.size-8) {
          if (dodge > 0 && Math.random() < dodge) {
            invuln1 = 30;
            spawnParticle(t1.x, t1.y - t1.size, '✨', '#85B7EB');
            continue;
          }
          if (bounce) {
            bounceCount++;
            const dx = t1.x-r.x, dy = t1.y-r.y;
            const len = Math.hypot(dx, dy)||1;
            t1.x += (dx/len)*60; t1.y += (dy/len)*60;
            t1.x = Math.max(t1.size, Math.min(MAP_W-t1.size, t1.x));
            t1.y = Math.max(t1.size, Math.min(MAP_H-t1.size, t1.y));
            invuln1 = 30;
            playHit();
            if (bounceCount >= 3) {
              bounceCount = 0;
              lives1--;
              runStats.noHits = false;
              if (livesEl) livesEl.textContent = Math.max(0, lives1);
              spawnParticle(t1.x, t1.y, '-1 ❤️', '#C75A5A');
              combo1 = 0; comboTimer1 = 0; comboBox.style.display = 'none';
              if (lives1 <= 0) {
                gameOver = true;
                deathAnim = { x: t1.x, y: t1.y, rot: 0, frame: 0 };
                playBek();
                setTimeout(() => finishGame(t().hitRock), 800);
                return;
              }
            }
            continue;
          }
          // Normalne trafienie
          lives1--;
          runStats.noHits = false;
          if (livesEl) livesEl.textContent = Math.max(0, lives1);
          invuln1 = 90;
          combo1 = 0; comboTimer1 = 0; comboBox.style.display = 'none';
          spawnParticle(t1.x, t1.y, '-1 ❤️', '#C75A5A');
          playHit();
          const dx = t1.x-r.x, dy = t1.y-r.y;
          const len = Math.hypot(dx, dy)||1;
          t1.x += (dx/len)*40; t1.y += (dy/len)*40;
          t1.x = Math.max(t1.size, Math.min(MAP_W-t1.size, t1.x));
          t1.y = Math.max(t1.size, Math.min(MAP_H-t1.size, t1.y));
          if (lives1 <= 0) {
            gameOver = true;
            deathAnim = { x: t1.x, y: t1.y, rot: 0, frame: 0 };
            playBek();
            setTimeout(() => finishGame(t().hitRock), 800);
            return;
          }
          break;
        }
        if (isDuo && invuln2 <= 0 && dist(r, t2) < t2.size+r.size-8) {
          // Dodge dla żółtego
          if (dodge2 > 0 && Math.random() < dodge2) {
            invuln2 = 30;
            spawnParticle(t2.x, t2.y - t2.size, '✨', '#85B7EB');
            continue;
          }
          // Star shield dla żółtego
          if (starShield2 > 0) continue;
          lives2--;
          invuln2 = 90;
          combo2 = 0; comboTimer2 = 0;
          spawnParticle(t2.x, t2.y, '-1 ❤️', '#C75A5A');
          playHit();
          const dx = t2.x-r.x, dy = t2.y-r.y;
          const len = Math.hypot(dx, dy)||1;
          t2.x += (dx/len)*40; t2.y += (dy/len)*40;
          t2.x = Math.max(t2.size, Math.min(MAP_W-t2.size, t2.x));
          t2.y = Math.max(t2.size, Math.min(MAP_H-t2.size, t2.y));
          if (lives2 <= 0) {
            gameOver = true;
            deathAnim = { x: t2.x, y: t2.y, rot: 0, frame: 0 };
            playBek();
            setTimeout(() => finishGame(t().hitRock), 800);
            return;
          }
          break;
        }
      }
    }

    function finishGame(msg) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.fillStyle = '#fff';
      ctx.font = '500 24px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(msg, VIEW_W/2, VIEW_H/2-30);
      ctx.font = '500 22px sans-serif';
      if (isEndless) {
        // W endless: główny wynik = sekundy. Sałaty pokazane jako "monety za rundę"
        ctx.fillStyle = '#FAC775';
        ctx.fillText('⏱️ ' + elapsedSec + 's', VIEW_W/2, VIEW_H/2+5);
        ctx.fillStyle = '#fff';
        ctx.font = '500 16px sans-serif';
        ctx.fillText(t().lettucesLabel + ' ' + score1 + ' 🥬', VIEW_W/2, VIEW_H/2+30);
      } else {
        const total = score1 + score2;
        ctx.fillText(t().lettucesLabel + ' ' + total + ' 🥬', VIEW_W/2, VIEW_H/2+5);
      }
      const bestNow = isDuo ? Math.max(score1, score2) : score1;
      let wasBest = false;
      if (mode === 'solo') wasBest = bestNow > player.soloBest;
      else if (mode === 'duo') wasBest = bestNow > player.duoBest;
      else if (mode === 'endless') wasBest = elapsedSec > (player.endlessBest || 0);
      if (wasBest) {
        ctx.fillStyle = '#FAC775';
        ctx.font = '500 18px sans-serif';
        ctx.fillText(t().newRecord, VIEW_W/2, VIEW_H/2 + (isEndless ? 55 : 35));
        playWin();
      }
      ctx.fillStyle = '#fff'; ctx.font = '14px sans-serif';
      ctx.fillText(t().backingToLobby, VIEW_W/2, VIEW_H/2 + (isEndless ? 85 : 65));
      cleanup();
      // Speedrun check: 10+ sałat w pierwszych 30 sek (tylko solo)
      if (mode === 'solo' && score1 >= 10 && elapsedSec <= 30) runStats.speedrun = true;
      // Przekazuję elapsedSec żeby endGame wiedział ile gracz wytrzymał
      runStats.elapsedSec = elapsedSec;
      setTimeout(() => endGame(mode, score1, score2, runStats), 2200);
    }

    function drawMapBg() {
      const isDouble = eventOn && eventState.type === 'double';
      // Tło - ciemniejsza zieleń żeby sałata i żółw były widoczne
      ctx.fillStyle = isRain ? '#B5D5EE' : (isDouble ? '#F5DDA8' : '#7FA94A');
      ctx.fillRect(0, 0, VIEW_W, VIEW_H);

      // TRAWA — wysokie, ciemne kępki, łatwe do odróżnienia od sałaty
      const grassColor = isRain ? '#3F6B95' : (isDouble ? '#A57515' : '#3D5F1E');
      const grassColorLight = isRain ? '#5D88AC' : (isDouble ? '#C09030' : '#4F7B26');
      ctx.fillStyle = grassColor;
      const step = 28;
      const sx = Math.floor(camX/step)*step, sy = Math.floor(camY/step)*step;
      for (let x = sx; x < camX+VIEW_W+step; x += step) {
        for (let y = sy; y < camY+VIEW_H+step; y += step) {
          // Pseudolosowa pozycja kępki w komórce
          const seed = ((Math.abs(x)*7+Math.abs(y)*13) % 100) / 100;
          const seed2 = ((Math.abs(x)*11+Math.abs(y)*17) % 100) / 100;
          const tx = x - camX + seed * 18;
          const ty = y - camY + seed2 * 18;
          // Kępka trawy: 3 łodyżki różnej wysokości
          ctx.fillStyle = grassColor;
          ctx.fillRect(tx, ty, 2, 9);
          ctx.fillRect(tx + 3, ty + 2, 2, 7);
          ctx.fillRect(tx + 6, ty + 1, 2, 8);
          // Jaśniejsze końce - daje wrażenie 3D
          ctx.fillStyle = grassColorLight;
          ctx.fillRect(tx, ty, 2, 2);
          ctx.fillRect(tx + 3, ty + 2, 2, 2);
          ctx.fillRect(tx + 6, ty + 1, 2, 2);
        }
      }

      // Granica mapy - gruba czerwona aż widoczna
      ctx.strokeStyle = '#5F3A1A';
      ctx.lineWidth = 5;
      ctx.strokeRect(-camX, -camY, MAP_W, MAP_H);

      // Krople deszczu
      if (isRain) {
        ctx.fillStyle = 'rgba(24, 95, 165, 0.5)';
        for (let i = 0; i < 25; i++) {
          const dx = ((i * 73 + (Date.now()/30)) % VIEW_W);
          const dy = ((i * 41 + (Date.now()/15)) % VIEW_H);
          ctx.fillRect(dx, dy, 2, 10);
        }
      }
    }

    function draw() {
      drawMapBg();
      rocks.forEach(drawRock);
      lettuces.forEach(drawLettuce);
      powerups.forEach(drawPowerup);
      if (!gameOver || !deathAnim) drawTurtle(t1, invuln1);
      if (isDuo && (!gameOver || !deathAnim)) drawTurtle(t2, invuln2);
      drawDeath();
      drawParticles();
    }
    function loop() { update(); draw(); if (!gameOver || (deathAnim && deathAnim.frame < 30)) rafId = requestAnimationFrame(loop); }
    function tick() {
      if (gameOver) return;
      elapsedSec++;
      if (isEndless) {
        // Endless: timeEl pokazuje sekundy przetrwania (rośnie)
        timeEl.textContent = elapsedSec;
        // Brak warunku końca z czasu - kończy się tylko śmiercią
      } else {
        timeLeft--;
        timeEl.textContent = timeLeft;
        if (timeLeft <= 0) {
          gameOver = true;
          const total = score1 + score2;
          if (total >= target) playWin(); else playBek();
          finishGame(total >= target ? t().youWin : t().timeUp);
        }
      }
    }

    const onK = e => { keys[e.key]=true; if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault(); unlockAudio(); };
    const onU = e => { keys[e.key]=false; };
    document.addEventListener('keydown', onK);
    document.addEventListener('keyup', onU);
    canvas.addEventListener('click', () => unlockAudio());
    canvas.addEventListener('touchstart', () => unlockAudio(), { passive: true });

    function cleanup() {
      if (rafId) cancelAnimationFrame(rafId);
      if (timer) clearInterval(timer);
      document.removeEventListener('keydown', onK);
      document.removeEventListener('keyup', onU);
    }
    init();
    timer = setInterval(tick, 1000);
    rafId = requestAnimationFrame(loop);
  }

  function render() {
    if (screen === 'auth') renderAuth();
    else if (screen === 'lobby') renderLobby();
    else if (screen === 'shop') renderShop();
    else if (screen === 'limited') renderLimitedShop();
    else if (screen === 'ach') renderAchievements();
    else if (screen === 'profile') renderProfile();
    else if (screen === 'friends') renderFriends();
    else if (screen === 'duoChoose') renderDuoChoose();
    else renderGame(screen); // 'solo', 'duo', 'endless'
  }
  load();
})();
</script>
